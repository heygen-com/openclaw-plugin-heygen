name: Publish to ClawHub

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Build
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Install ClawHub CLI
        run: npm install -g clawhub

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Write ClawHub config
        run: |
          mkdir -p "$HOME/.config/clawhub"
          echo '{"registry":"https://clawhub.ai","token":"${{ secrets.CLAWHUB_TOKEN }}"}' > "$HOME/.config/clawhub/config.json"
          chmod 600 "$HOME/.config/clawhub/config.json"

      - name: Verify auth
        run: clawhub whoami

      - name: Publish openclaw-plugin-heygen
        run: |
          CHANGELOG=$(git tag -l --format='%(contents)' ${{ github.ref_name }})
          clawhub publish . \
            --slug openclaw-plugin-heygen \
            --version ${{ steps.version.outputs.version }} \
            --name "HeyGen Video Agent and Voice" \
            --changelog "$CHANGELOG"
